
<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>คอร์สออนไลน์ เตรียมสอบครูผู้ช่วย สพฐ.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css" crossorigin="anonymous">
    <style>
      html {
        font-size: 90%;
      }
      body {
        font-family: 'Sarabun', sans-serif;
      }

      /* Print Styles for PDF Export */
      @media print {
        @page {
          size: A4;
          margin: 2cm;
        }
        
        /* Hide the main app application */
        #root {
          display: none !important;
        }

        /* Reset body for print */
        body {
          background-color: white !important;
          margin: 0 !important;
          padding: 0 !important;
          width: 100% !important;
          height: auto !important;
          overflow: visible !important;
        }

        /* Show only the print portal */
        #print-portal {
          display: block !important;
          visibility: visible !important;
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          margin: 0;
          padding: 0;
          background: white !important;
          color: black !important;
          
          /* Enforce Font Requirement: TH Sarabun PSK 16pt */
          font-family: 'TH Sarabun PSK', 'Sarabun', sans-serif !important;
          font-size: 16pt !important;
          line-height: 1.5;
          z-index: 9999;
        }

        /* Typography for Print */
        #print-portal h1 {
          font-size: 24pt !important;
          font-weight: bold;
          text-align: center;
          margin-bottom: 24px;
        }

        #print-portal h2 {
          font-size: 20pt !important;
          font-weight: bold;
          margin-top: 20px;
          margin-bottom: 12px;
          border-bottom: 1px solid #000;
          padding-bottom: 6px;
        }

        #print-portal h3 {
           font-size: 18pt !important;
           font-weight: bold;
           margin-bottom: 8px;
        }

        #print-portal p, 
        #print-portal div, 
        #print-portal span,
        #print-portal li {
          font-size: 16pt !important;
          color: black !important;
        }

        /* Formatting Helpers in Print */
        #print-portal u { text-decoration: underline; }
        #print-portal b, #print-portal strong { font-weight: bold; }
        #print-portal i, #print-portal em { font-style: italic; }

        /* Layout helpers */
        .print-question-item {
          page-break-inside: avoid;
          margin-bottom: 20px;
          padding-bottom: 20px;
          border-bottom: 1px dashed #ccc;
        }
        
        .print-score-box {
          border: 1px solid #000;
          padding: 10px;
          text-align: center;
          margin-bottom: 20px;
          border-radius: 8px;
        }
      }

      /* Hide print portal on screen */
      #print-portal {
        display: none;
      }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-slate-50 text-slate-900">
    <div id="root"></div>
    <div id="print-portal"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
